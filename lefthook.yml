# Local enforcement. Branch protection covers the server side; these hooks catch the
# same mistakes before a push, which is faster than waiting on CI.
#
# Everything here is stdlib Python, so it works before `pnpm install` has ever run and
# keeps working if the JavaScript toolchain changes.
#
# Install:  pnpm lefthook install     (done automatically by the `prepare` script)
# Bypass:   git commit --no-verify    (for a genuine emergency; CI still gates the merge)

pre-commit:
  commands:
    secrets:
      # Catches a credential while it is still staged. Once it is committed it is in
      # history, and rewriting shared history costs far more than this check.
      run: infisical scan git-changes --staged --redact

commit-msg:
  commands:
    conventional-commit:
      run: python tools/check_commit_message.py {1}

pre-push:
  parallel: true
  commands:
    boundaries:
      run: python tools/check_boundaries.py
    invariants:
      run: python tools/check_invariant_coverage.py
    contrast:
      run: python tools/check_contrast.py
    openapi:
      # G10's first half, locally. The generator boots the api's module graph, so it is the
      # only local check that proves the graph still constructs - `typecheck` and `test` both
      # pass without ever building it. Added 21 August 2026 after a green local run pushed a
      # branch that failed CI here: correcting the runtimes to DATABASE_URL_APP left the
      # generator seeding the owner's variable, and nothing local noticed.
      run: pnpm --filter @convert/api openapi:generate && git diff --exit-code -- apps/api/openapi.json
    notion-mirror:
      # G15. No network access, so it is as cheap locally as the others.
      run: python tools/check_notion_mirror.py
