name: CI

on:
  push:
    # develop is here because deploy-test keys on it (ADR 0024). Without it the
    # workflow never fires for develop, so the deploy job's condition is
    # unreachable and the test environment silently never updates.
    branches: [main, develop]
  pull_request:

# Gates G1-G13 from docs/engineering-guardrails.md §3.
# Every job is written to pass on an empty repository and tighten automatically as
# the code it guards lands. A pipeline that is red from day one gets disabled.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Not a secret: a project id is useless without a token (ADR 0024).
  RAILWAY_PROJECT: f88057ad-7cda-4051-aaea-8d0c1a625682

jobs:
  guardrails:
    name: G1-G2 boundaries and ADR discipline, G14-G15 secrets and mirror
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # G1 - layer boundaries. No dependencies, runs in under a second.
      - name: Check layer boundaries
        run: python tools/check_boundaries.py

      # G2 - a layering change must arrive with an ADR.
      - name: Check ADR discipline
        if: github.event_name == 'pull_request'
        run: python tools/check_adr_discipline.py --base origin/${{ github.base_ref }}

      # G15 - the Notion mirror. No network access: this compares the manifest
      # against the working tree, so it needs no token and cannot flake.
      - name: G15 Notion mirror is current
        run: python tools/check_notion_mirror.py

      # G14 - secret scanning. The repository is public, so a leaked credential is
      # public the moment it lands. Runs on history, not just the diff, because a
      # rewritten branch can carry an older commit in.
      - name: G14 secret scan
        env:
          # Nothing may stop to ask a question on a runner with no terminal.
          DEBIAN_FRONTEND: noninteractive
        run: |
          curl -1sLf 'https://artifacts-cli.infisical.com/setup.deb.sh' | sudo -E bash
          # The runner runs its own background upgrades, which hold the dpkg lock.
          # apt waits on it forever by default, which reads as a hung job rather
          # than a slow one. Queue for three minutes, then fail for real (ADR 0023).
          sudo apt-get install -y -o DPkg::Lock::Timeout=180 infisical
          # --redact matters on a public repository: without it a detected secret
          # gets printed into a world-readable build log, which is the leak.
          infisical scan --redact --exit-code=1

  quality:
    name: G3-G6 types, lint, tests, invariants
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Detect workspace
        id: ws
        run: echo "ready=$([ -f pnpm-lock.yaml ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6
        if: steps.ws.outputs.ready == 'yes'

      - uses: actions/setup-node@v7
        if: steps.ws.outputs.ready == 'yes'
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        if: steps.ws.outputs.ready == 'yes'
        run: pnpm install --frozen-lockfile

      - name: G3 type check
        if: steps.ws.outputs.ready == 'yes'
        run: pnpm typecheck

      - name: G4 lint
        if: steps.ws.outputs.ready == 'yes'
        run: pnpm lint

      - name: G5 unit tests
        if: steps.ws.outputs.ready == 'yes'
        run: pnpm test

      # G6 - every invariant in architecture.md §6 has a test, built or not.
      # G10 - the committed OpenAPI spec must match what the code generates.
      # An API change is then a reviewable diff, not a surprise for a consumer.
      - name: G10 OpenAPI spec is current
        if: steps.ws.outputs.ready == 'yes' && hashFiles('apps/api/package.json') != ''
        run: |
          pnpm --filter @convert/api openapi:generate
          git diff --exit-code -- apps/api/openapi.json \
            || { echo "::error::openapi.json is stale. Run 'pnpm --filter @convert/api openapi:generate' and commit the result."; exit 1; }

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: G6 invariant coverage
        run: python tools/check_invariant_coverage.py

      # G13 - design token contrast. Palette regressions are silent otherwise, and
      # this product is read outdoors on mid-range phones.
      - name: G13 design token contrast
        run: python tools/check_contrast.py

  database:
    name: G7-G8 migrations, RLS, integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: convert_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Detect migrations
        id: mig
        run: |
          count=$(find packages/infra/src/db/migrations -type f 2>/dev/null | wc -l)
          echo "ready=$([ "$count" -gt 0 ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6
        if: steps.mig.outputs.ready == 'yes'
      - uses: actions/setup-node@v7
        if: steps.mig.outputs.ready == 'yes'
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        if: steps.mig.outputs.ready == 'yes'
        run: pnpm install --frozen-lockfile

      # G7 - migrations apply to an empty database, and every tenant table has RLS.
      - name: G7 migrate and assert RLS
        if: steps.mig.outputs.ready == 'yes'
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/convert_test
        run: |
          pnpm --filter @convert/infra migrate
          pnpm --filter @convert/infra assert:rls

      # G8 - integration tests against the real thing, never a mock database.
      - name: G8 integration tests
        if: steps.mig.outputs.ready == 'yes'
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/convert_test
        run: pnpm test:integration

  performance:
    name: G9 mobile performance budget
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Detect web app
        id: web
        run: echo "ready=$([ -f apps/web/package.json ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6
        if: steps.web.outputs.ready == 'yes'
      - uses: actions/setup-node@v7
        if: steps.web.outputs.ready == 'yes'
        with:
          node-version: 22
          cache: pnpm

      # G9 - budgets from docs/architecture.md §18, on a throttled mobile profile.
      # Fails the build on regression; "mobile-first" is the product's differentiation claim.
      - name: G9 Lighthouse budget
        if: steps.web.outputs.ready == 'yes'
        run: |
          pnpm install --frozen-lockfile
          # turbo builds the workspace packages first; next build type-checks against
          # their declarations, so a filtered build alone fails on a clean checkout.
          pnpm build
          pnpm dlx @lhci/cli autorun --config=./lighthouserc.json

  # ---------------------------------------------------------------- deployment
  #
  # Nothing deploys because a commit appeared on a branch: Railway's deployment
  # triggers are deleted, and these jobs are the only path (ADR 0024). `needs`
  # is the enforcement, so a deploy cannot start until every gate has passed.
  #
  # Each job has its own switch, DEPLOY_TEST and DEPLOY_STAGING, so one
  # environment can be turned off without touching the other. Both are off
  # until the variable is "true" and that environment holds a token.
  # Merging a deploy job that cannot authenticate would put a permanent red
  # job on main, and a red main everyone learns to ignore is worse than no
  # deploy job at all.
  #
  # The credential is passed as RAILWAY_API_TOKEN, not RAILWAY_TOKEN. The CLI
  # reads the two as different token types: RAILWAY_TOKEN must be a project
  # token, and ours is workspace-scoped because minting a project token needs a
  # verified account (ADR 0024, ADR 0026). A workspace token arriving as
  # RAILWAY_TOKEN is rejected as Unauthorized. Only one of the two may be set;
  # setting both is an error, so do not "try both".
  #
  # The environment secret is still named RAILWAY_TOKEN. That name now
  # understates what it is, and ADR 0026 says why renaming it waits.

  deploy-test:
    name: Deploy to test
    needs: [guardrails, quality, database, performance]
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/develop'
      && vars.DEPLOY_TEST == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: test
      url: https://convertweb-test.up.railway.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install the Railway CLI
        run: npm install -g @railway/cli

      # Deployed one service at a time rather than a whole environment, so a
      # failure names which one. `railway up` uploads this checkout, so the
      # artifact is the commit the gates ran against rather than whatever the
      # branch pointer resolves to afterwards.
      - name: Deploy api
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --ci --service '@convert/api' --environment test --project "$RAILWAY_PROJECT"

      - name: Deploy web
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --ci --service '@convert/web' --environment test --project "$RAILWAY_PROJECT"

      # A deploy that reports success while the service is down is the failure
      # mode worth catching, so ask the running thing rather than trusting the
      # exit code.
      - name: Prove it serves
        run: |
          for url in \
            https://convertapi-test.up.railway.app/health \
            https://convertweb-test.up.railway.app/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 --retry 5 --retry-delay 10 "$url")
            echo "$url -> $code"
            [ "$code" = "200" ] || exit 1
          done

  deploy-staging:
    name: Deploy to staging
    needs: [guardrails, quality, database, performance]
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && vars.DEPLOY_STAGING == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
      url: https://convertweb-production.up.railway.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install the Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy api
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --ci --service '@convert/api' --environment staging --project "$RAILWAY_PROJECT"

      - name: Deploy web
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --ci --service '@convert/web' --environment staging --project "$RAILWAY_PROJECT"

      - name: Prove it serves
        run: |
          for url in \
            https://convertapi-production.up.railway.app/health \
            https://convertweb-production.up.railway.app/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 --retry 5 --retry-delay 10 "$url")
            echo "$url -> $code"
            [ "$code" = "200" ] || exit 1
          done
