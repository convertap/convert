name: CI

on:
  push:
    # All promotion branches run the same gates. Only testing and staging have
    # deploy jobs; develop is integration-only and main is the production branch.
    branches: [develop, testing, staging, main]
  pull_request:

permissions:
  contents: read

# Gates G1-G13 from docs/engineering-guardrails.md §3.
# Every job is written to pass on an empty repository and tighten automatically as
# the code it guards lands. A pipeline that is red from day one gets disabled.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Stale PR checks are disposable. A branch push may already have handed a
  # build to Railway, so cancelling it can leave an unverified release running.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Not a secret: a project id is useless without a token (ADR 0024).
  RAILWAY_PROJECT: f88057ad-7cda-4051-aaea-8d0c1a625682

jobs:
  guardrails:
    name: G1-G2 boundaries and ADR discipline, G14-G15 secrets and mirror
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # ADR 0049 - long-lived branches advance in one direction only. Branch
      # protection requires this job, so a PR cannot skip an environment.
      - name: Validate promotion route
        if: github.event_name == 'pull_request'
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          case "$BASE_BRANCH" in
            testing) expected=develop ;;
            staging) expected=testing ;;
            main) expected=staging ;;
            develop)
              case "$HEAD_BRANCH" in
                testing|staging|main)
                  echo "::error::Long-lived branches cannot be promoted backward into develop."
                  exit 1
                  ;;
              esac
              exit 0
              ;;
            *)
              echo "::error::Unsupported pull request target: $BASE_BRANCH"
              exit 1
              ;;
          esac

          if [ "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::Promotion pull requests must come from $GITHUB_REPOSITORY."
            exit 1
          fi

          if [ "$HEAD_BRANCH" != "$expected" ]; then
            echo "::error::Pull requests to $BASE_BRANCH must come from $expected, not $HEAD_BRANCH."
            exit 1
          fi

      # A branch name proves where a candidate came from; these check runs prove
      # that candidate actually deployed and served in the preceding environment.
      - name: Validate source environment
        if: >-
          github.event_name == 'pull_request'
          && (github.base_ref == 'staging' || github.base_ref == 'main')
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          REQUIRED_ENVIRONMENT: ${{ github.base_ref == 'staging' && 'test' || 'staging' }}
        run: |
          for service in api web; do
            check_name="Deploy $service to $REQUIRED_ENVIRONMENT"
            response=$(curl --fail-with-body --silent --show-error --get \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data-urlencode "check_name=$check_name" \
              --data-urlencode "filter=latest" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA/check-runs")
            conclusion=$(jq -r '.check_runs[0].conclusion // "missing"' <<< "$response")
            if [ "$conclusion" != "success" ]; then
              echo "::error::$check_name is $conclusion for $SOURCE_SHA; deploy and prove the source environment before promotion."
              exit 1
            fi
          done

      # Squash or rebase promotion rewrites the commit and leaves the environment
      # branches permanently divergent. Deployment branches must receive a merge
      # commit; this post-merge check blocks deployment if the wrong button was used.
      - name: Validate promotion merge
        if: >-
          github.event_name == 'push'
          && (github.ref == 'refs/heads/testing'
          || github.ref == 'refs/heads/staging'
          || github.ref == 'refs/heads/main')
        run: |
          parent_count=$(git rev-list --parents -n 1 HEAD | awk '{ print NF - 1 }')
          if [ "$parent_count" -ne 2 ]; then
            echo "::error::$GITHUB_REF_NAME must advance with a merge commit from its promotion PR."
            exit 1
          fi

      # G1 - layer boundaries. No dependencies, runs in under a second.
      - name: Check layer boundaries
        run: python tools/check_boundaries.py

      # G2 - a layering change must arrive with an ADR.
      - name: Check ADR discipline
        if: github.event_name == 'pull_request'
        run: python tools/check_adr_discipline.py --base origin/${{ github.base_ref }}

      # G15 - the Notion mirror. No network access: this compares the manifest
      # against the working tree, so it needs no token and cannot flake.
      - name: G15 Notion mirror is current
        run: python tools/check_notion_mirror.py

      # G14 - secret scanning. The repository is public, so a leaked credential is
      # public the moment it lands. Runs on history, not just the diff, because a
      # rewritten branch can carry an older commit in.
      - name: G14 secret scan
        run: |
          archive=cli_0.43.124_linux_amd64.tar.gz
          curl -fsSLo "/tmp/$archive" "https://github.com/Infisical/cli/releases/download/v0.43.124/$archive"
          echo "675ae9293a7a089fb63d95eb9189dca181c95e4fe3cf376a6da7e5f9093850d6  /tmp/$archive" | sha256sum --check
          tar -xzf "/tmp/$archive" -C /tmp
          sudo install -m 0755 /tmp/infisical /usr/local/bin/infisical
          # --redact matters on a public repository: without it a detected secret
          # gets printed into a world-readable build log, which is the leak.
          infisical scan --redact --exit-code=1

  quality:
    name: G3-G6 types, lint, tests, invariants
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Detect workspace
        id: ws
        run: echo "ready=$([ -f pnpm-lock.yaml ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6
        if: steps.ws.outputs.ready == 'yes'

      - uses: actions/setup-node@v7
        if: steps.ws.outputs.ready == 'yes'
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        if: steps.ws.outputs.ready == 'yes'
        run: pnpm install --frozen-lockfile

      - name: G3 type check
        if: steps.ws.outputs.ready == 'yes'
        run: pnpm typecheck

      - name: G4 lint
        if: steps.ws.outputs.ready == 'yes'
        run: pnpm lint

      - name: G5 unit tests
        if: steps.ws.outputs.ready == 'yes'
        run: pnpm test

      # G6 - every invariant in architecture.md §6 has a test, built or not.
      # G10 - the committed OpenAPI spec must match what the code generates.
      # An API change is then a reviewable diff, not a surprise for a consumer.
      - name: G10 OpenAPI spec is current
        if: steps.ws.outputs.ready == 'yes' && hashFiles('apps/api/package.json') != ''
        run: |
          pnpm --filter @convert/api openapi:generate
          git diff --exit-code -- apps/api/openapi.json \
            || { echo "::error::openapi.json is stale. Run 'pnpm --filter @convert/api openapi:generate' and commit the result."; exit 1; }

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: G6 invariant coverage
        run: python tools/check_invariant_coverage.py

      # G10, second half - no endpoint is undocumented. ADR 0015 always claimed this and
      # nothing enforced it; ADR 0045 makes it real. Reads the spec regenerated above, so
      # it judges what the code produces rather than what a decorator looks like.
      - name: G10 OpenAPI spec is complete
        # No hashFiles guard: a missing spec must fail this step, not skip it. The
        # script reports the absence itself, which a skipped step never would.
        if: steps.ws.outputs.ready == 'yes'
        run: python tools/check_openapi_complete.py

      # G13 - design token contrast. Palette regressions are silent otherwise, and
      # this product is read outdoors on mid-range phones.
      - name: G13 design token contrast
        run: python tools/check_contrast.py

  database:
    name: G7-G8 migrations, RLS, integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: convert_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Detect migrations
        id: mig
        run: |
          count=$(find packages/infra/src/db/migrations -type f 2>/dev/null | wc -l)
          echo "ready=$([ "$count" -gt 0 ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      # Not gated on migrations existing. The tenancy role check below is meaningful with
      # zero tables and zero migrations, and gating it was why G7 stayed vacuous.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile

      # The db scripts import @convert/contracts, which resolves to its build output, so
      # the workspace packages must exist before bootstrap runs. Installing is not enough,
      # and the failure presents as module-not-found deep inside a script rather than as
      # anything resembling a build problem (ADR 0044 put the closed sets in contracts).
      - name: Build workspace packages
        run: pnpm build

      # G7 - migrations apply to an empty database, and every tenant table has RLS that
      # the application role is actually SUBJECT to.
      #
      # Two connection strings on purpose. DATABASE_URL is the owner, used for DDL and for
      # reading the catalogue. DATABASE_URL_APP is the role the application would really
      # use. Asserting RLS while connected as postgres proves nothing, because a superuser
      # always bypasses it (ADR 0042).
      # Runs with or without migrations. Creates convert_app and asserts it is neither a
      # superuser nor BYPASSRLS - the property without which every policy is decoration.
      - name: G7 bootstrap the application role
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/convert_test
          APP_DB_PASSWORD: ci-throwaway
        run: pnpm --filter @convert/infra bootstrap

      - name: G7 migrate
        if: steps.mig.outputs.ready == 'yes'
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/convert_test
        run: pnpm --filter @convert/infra migrate

      # Two connection strings on purpose. DATABASE_URL is the owner, for the catalogue.
      # DATABASE_URL_APP is the role the application would really use. Asserting RLS while
      # connected as postgres proves nothing, because a superuser always bypasses it.
      - name: G7 assert RLS applies to the application role
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/convert_test
          DATABASE_URL_APP: postgres://convert_app:ci-throwaway@localhost:5432/convert_test
        run: pnpm --filter @convert/infra assert:rls

      # ADR 0052 requires the migration owner to be able to bypass row-level security, because a
      # backfill against a FORCE'd table otherwise reports success having changed nothing. The step
      # above connects as postgres, a superuser, so that assertion is satisfied by construction
      # there and could never go red - which is the ADR 0048 trap: a check named as real that cannot
      # fail where it runs. This step points DATABASE_URL at a deliberately restricted role and
      # requires the gate to reject it, so the assertion is exercised rather than assumed.
      - name: G7 owner must not be able to be restricted
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d convert_test -v ON_ERROR_STOP=1 -c \
            "drop role if exists ci_restricted_owner;
             create role ci_restricted_owner login password 'ci-throwaway' nosuperuser nobypassrls;
             grant all on schema public to ci_restricted_owner;"
          if DATABASE_URL=postgres://ci_restricted_owner:ci-throwaway@localhost:5432/convert_test \
             DATABASE_URL_APP=postgres://convert_app:ci-throwaway@localhost:5432/convert_test \
             pnpm --filter @convert/infra assert:rls; then
            echo "::error::assert:rls accepted a migration owner that cannot bypass RLS. ADR 0052 requires it to fail."
            exit 1
          fi
          echo "assert:rls rejected the restricted owner, as ADR 0052 requires"
          psql -h localhost -U postgres -d convert_test -v ON_ERROR_STOP=1 -c \
            "drop owned by ci_restricted_owner; drop role ci_restricted_owner;"

      # G7 - the column conventions of ADR 0046, read from the catalogue rather than from a
      # reviewer's memory: money as integer pesewas in bigint and never numeric or a float,
      # rates as integer basis points, every timestamp timestamptz, created_at everywhere,
      # updated_at exactly where UPDATE is granted, and soft delete confined to media_asset.
      # Runs without migrations and says plainly that an empty schema proves nothing.
      - name: G7 assert column conventions
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/convert_test
        run: pnpm --filter @convert/infra assert:conventions

      # G8 - integration tests against the real thing, never a mock database.
      - name: G8 integration tests
        if: steps.mig.outputs.ready == 'yes'
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/convert_test
          DATABASE_URL_APP: postgres://convert_app:ci-throwaway@localhost:5432/convert_test
        run: pnpm test:integration

  performance:
    name: G9 mobile performance budget
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Detect web app
        id: web
        run: echo "ready=$([ -f apps/web/package.json ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6
        if: steps.web.outputs.ready == 'yes'
      - uses: actions/setup-node@v7
        if: steps.web.outputs.ready == 'yes'
        with:
          node-version: 22
          cache: pnpm

      # G9 - budgets from docs/architecture.md §18, on a throttled mobile profile.
      # Fails the build on regression; "mobile-first" is the product's differentiation claim.
      - name: G9 Lighthouse budget
        if: steps.web.outputs.ready == 'yes'
        run: |
          pnpm install --frozen-lockfile
          # turbo builds the workspace packages first; next build type-checks against
          # their declarations, so a filtered build alone fails on a clean checkout.
          pnpm build
          pnpm dlx @lhci/cli@0.15.1 autorun --config=./lighthouserc.json

  # ---------------------------------------------------------------- deployment
  #
  # Railway's own deployment triggers are deleted, and these jobs are the only
  # deployment path (ADR 0024, ADR 0049). `needs` is the enforcement, so a
  # deploy cannot start until every gate has passed. The protected branch flow is
  # develop -> testing -> staging -> main. Develop and main never deploy here.
  #
  # Each job has its own switch, DEPLOY_TEST and DEPLOY_STAGING, so one
  # environment can be turned off without touching the other. Both are off
  # until the variable is "true" and that environment holds a token.
  # Merging a deploy job that cannot authenticate would put a permanent red
  # job on its deployment branch, and a red branch everyone learns to ignore
  # is worse than no deploy job at all.
  #
  # The credential is passed as RAILWAY_API_TOKEN, not RAILWAY_TOKEN. The CLI
  # reads the two as different token types: RAILWAY_TOKEN must be a project
  # token, and ours is workspace-scoped because minting a project token needs a
  # verified account (ADR 0024, ADR 0026). A workspace token arriving as
  # RAILWAY_TOKEN is rejected as Unauthorized. Only one of the two may be set;
  # setting both is an error, so do not "try both".
  #
  # The environment secret is still named RAILWAY_TOKEN. That name now
  # understates what it is, and ADR 0026 says why renaming it waits.

  #
  # One job per service, as a matrix, rather than two `railway up` calls in one
  # job. Railway queues builds: on 20 August each build sat ~10 minutes behind
  # "scheduling build on Metal builder", two serial builds blew the 20-minute
  # bound, and the job was cancelled *after* `railway up` had already handed the
  # build over. So both services deployed and "Prove it serves" never ran, which
  # is worse than a red job — it is an unverified deploy that looks like a
  # cancellation. Split, the builds run concurrently, each carries its own bound,
  # and each proves its own service. `fail-fast: false` matters: without it a
  # failing api cancels the web deploy mid-build (ADR 0027).

  deploy-test:
    name: Deploy ${{ matrix.name }} to test
    needs: [guardrails, quality, database, performance]
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/testing'
      && vars.DEPLOY_TEST == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            service: '@convert/api'
            probe: https://convertapi-test.up.railway.app/ready
          - name: web
            service: '@convert/web'
            probe: https://convertweb-test.up.railway.app/
    environment:
      name: test
      url: ${{ matrix.probe }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Pinned, not `latest`. @railway/cli published 377 versions and seven of
      # them in four days, so `latest` means two deploys an hour apart can run
      # different CLIs — and the deploy path has already broken once on this
      # CLI's auth behaviour (ADR 0026). Dependabot cannot see a global npm
      # install, so this number is bumped by hand; ADR 0028 says how.
      - name: Install the Railway CLI
        run: npm install -g @railway/cli@5.41.2

      # `railway up` uploads this checkout, so the artifact is the commit the
      # gates ran against rather than whatever the branch pointer resolves to
      # afterwards.
      - name: Deploy ${{ matrix.name }}
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --ci --service '${{ matrix.service }}' --environment test --project "$RAILWAY_PROJECT"

      # A deploy that reports success while the service is down is the failure
      # mode worth catching, so ask the running thing rather than trusting the
      # exit code.
      - name: Prove it serves
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 --retry 5 --retry-delay 10 "${{ matrix.probe }}")
          echo "${{ matrix.probe }} -> $code"
          [ "$code" = "200" ] || exit 1

  deploy-staging:
    name: Deploy ${{ matrix.name }} to staging
    needs: [guardrails, quality, database, performance]
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/staging'
      && vars.DEPLOY_STAGING == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            service: '@convert/api'
            probe: https://convertapi-production.up.railway.app/ready
          - name: web
            service: '@convert/web'
            probe: https://convertweb-production.up.railway.app/
    environment:
      name: staging
      url: ${{ matrix.probe }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Pinned, not `latest`. @railway/cli published 377 versions and seven of
      # them in four days, so `latest` means two deploys an hour apart can run
      # different CLIs — and the deploy path has already broken once on this
      # CLI's auth behaviour (ADR 0026). Dependabot cannot see a global npm
      # install, so this number is bumped by hand; ADR 0028 says how.
      - name: Install the Railway CLI
        run: npm install -g @railway/cli@5.41.2

      - name: Deploy ${{ matrix.name }}
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --ci --service '${{ matrix.service }}' --environment staging --project "$RAILWAY_PROJECT"

      - name: Prove it serves
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 --retry 5 --retry-delay 10 "${{ matrix.probe }}")
          echo "${{ matrix.probe }} -> $code"
          [ "$code" = "200" ] || exit 1
