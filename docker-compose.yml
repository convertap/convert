# Local Postgres only. Nothing else is stateful by design (ADR 0010 keeps the job
# queue in Postgres rather than adding Redis).
services:
  postgres:
    image: postgres:18-alpine # pg-version
    container_name: convert-postgres
    environment:
      POSTGRES_USER: convert
      POSTGRES_PASSWORD: convert
      POSTGRES_DB: convert
    ports:
      - '5432:5432'
    volumes:
      # Postgres 18 made PGDATA version-specific and declares its VOLUME here;
      # mounting /var/lib/postgresql/data no longer persists the cluster on 18.
      - convert-pgdata-18:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U convert']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  # convert-pgdata is an orphaned Postgres 16 cluster, safe to delete. # pg-version:historical=16
  # The rename keeps a checkout out of an incompatible-data-directory boot loop.
  convert-pgdata-18:
